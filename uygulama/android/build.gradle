// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // Crashlytics kendi Gradle eklentisini ister. Yalnızca Firebase
        // yapılandırılmışken indirilir; google-services.json yokken bu
        // bağımlılığı istemek, Firebase kullanmayan bir derlemeyi ağ
        // hatasıyla düşürürdü.
        if (file('app/google-services.json').exists()) {
            classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
