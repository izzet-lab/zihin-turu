# nginx.conf — tamisabet.tr statik sunumu (Coolify)
#
# NEDEN BU DOSYA VAR
# Site Cloudflare Pages'ten Coolify'a taşındı. Pages'te iki şeyi
# `public/_redirects` ve `public/_headers` hallediyordu; ikisi de
# Pages'e özgü dosyalar ve başka hiçbir sunucuda hükmü yok. Buradaki
# yapılandırma onların karşılığı:
#
#   _redirects → "/* /index.html 200"  →  try_files ... /index.html
#   _headers   → sw.js / index.html / manifest için no-cache
#
# İkisi de olmazsa iki ayrı arıza çıkar:
#   1. tamisabet.tr/lig adresine DOĞRUDAN girilince 404. Uygulama tek
#      sayfalık; /lig diye bir dosya yok, yönlendirmeyi React yapıyor.
#   2. Servis çalışanı ve index önbellekte kalır, oyuncu günlerce eski
#      sürümde takılır ve "güncelleme gelmiyor" der.
#
# NEDEN YALNIZCA server BLOĞU
# Coolify bu dosyayı kapsayıcıdaki /etc/nginx/conf.d/default.conf
# içine yazıyor; orası zaten http bloğunun içi. Tam bir nginx.conf
# (events/http sarmalayıcısıyla) yazılırsa nginx
# "events directive is not allowed here" deyip hiç açılmıyor —
# 19 Ekim 2026'daki ilk dağıtımda tam bu oldu, kapsayıcı döngüye girdi.
#
# Bu dosya Coolify'daki "Custom Nginx Configuration" alanına da
# yazılıdır. Değiştirilirse ikisi birden güncellenmeli; depo tek doğru
# kaynak, sunucudaki kopya ondan türer.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Sıkıştırma. Kelime sözlüğü yarım megabayt; sıkıştırılmadan
    # gönderilmesi mobil veride gereksiz yük.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml application/manifest+json;

    # Güvenlik başlıkları. Pages bunların bir kısmını kendiliğinden
    # koyuyordu; burada elle yazılıyor.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ----------------------------------------------------------------
    # UYGULAMA BAĞLANTI DOSYALARI
    #
    # Android App Links doğrulaması bu dosyayı YÖNLENDİRMESİZ ve
    # application/json tipiyle ister. SPA yedeğinin altında kalırsa
    # index.html döner ve doğrulama sessizce başarısız olur — bağlantı
    # uygulamayı açmaz, tarayıcıda kalır. Bu yüzden SPA kuralından
    # ÖNCE ve tam eşleşmeyle tanımlı.
    # ----------------------------------------------------------------
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # iOS Universal Links dosyası uzantısız servis edilir; iOS
    # uygulaması yayına girdiğinde bu blok etkinleşir (dosya yoksa 404
    # döner, zararsız).
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # ÖNBELLEK
    # ----------------------------------------------------------------

    # Hash'li varlıklar: adı değişmeden içeriği değişmez.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Bunlar güncel kalmalı (Pages'teki _headers karşılığı).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ----------------------------------------------------------------
    # SPA YEDEĞİ — EN SONDA
    # Önce gerçek dosya aranır; yoksa index.html döner ve yönlendirmeyi
    # React üstlenir. Yukarıdaki tam eşleşmeli bloklar bu kuralın
    # dışında kalsın diye önce yazıldı.
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
